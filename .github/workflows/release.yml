name: Release packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate tag and successful main CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi

          release_commit="$(git rev-list -n 1 "$tag")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release commit $release_commit is not contained in origin/main." >&2
            exit 1
          fi

          for attempt in $(seq 1 60); do
            successful_runs="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$release_commit" \
              -f event=push \
              -f per_page=100 \
              --jq '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success")] | length')"
            if [[ "$successful_runs" -gt 0 ]]; then
              echo "Found a successful CI run for $release_commit."
              exit 0
            fi

            failed_runs="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$release_commit" \
              -f event=push \
              -f status=completed \
              -f per_page=100 \
              --jq '[.workflow_runs[] | select(.conclusion != "success")] | length')"
            if [[ "$failed_runs" -gt 0 ]]; then
              echo "CI completed without success for $release_commit." >&2
              exit 1
            fi

            echo "Waiting for CI on $release_commit ($attempt/60)..."
            sleep 30
          done

          echo "No successful CI run found for $release_commit after 30 minutes." >&2
          exit 1

  release-quality:
    needs: validate-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Install Linux quality dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang libgl1-mesa-dev libxkbcommon-x11-0 libpulse-dev
          libsecret-1-dev libasound2-dev ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.10.3"
          modules: "qthttpserver qtmultimedia qtwebsockets"
          cache: true

      - name: Configure sanitizers
        run: >-
          cmake -S . -B build-quality -G Ninja
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fsanitize-ignorelist=${{ github.workspace }}/.github/sanitizers/ubsan-ignorelist.txt"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fsanitize-ignorelist=${{ github.workspace }}/.github/sanitizers/ubsan-ignorelist.txt"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined

      - name: Build sanitizer instrumentation
        run: cmake --build build-quality --parallel

      - name: Run sanitizer suites
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          QT_QPA_PLATFORM: offscreen
        run: >-
          ctest --test-dir build-quality
          --output-on-failure
          --output-junit build-quality/ctest-sanitizers.xml

      - name: Analyze C++ with CodeQL
        uses: github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          category: /language:c-cpp
          upload: false
          output: build-quality/codeql-results

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: build-quality
          format: spdx-json
          output-file: HolyScreen-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # O diretório de build é saída gerada, não fonte do projeto. O FetchContent
      # materializa ali a árvore completa de cada dependência, incluindo
      # ferramentas auxiliares que o HolyScreen nunca compila nem distribui — o
      # gerador de documentação em npm do libgit2, a porta Java do qrcodegen e
      # as ligações Go do RtMidi. CVEs nesses manifestos não descrevem risco no
      # produto. As dependências que realmente entram no binário são fixadas por
      # checksum SHA-256 no CMakeLists e inventariadas no SBOM da release, que é
      # o controle correspondente.
      - name: Scan dependencies, configuration and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-dirs: build-quality
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-report.txt
          exit-code: 1

      - name: Upload release SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HolyScreen-SBOM
          path: HolyScreen-${{ github.ref_name }}.spdx.json
          if-no-files-found: error

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-quality-diagnostics
          path: |
            build-quality/ctest-sanitizers.xml
            build-quality/Testing/Temporary/LastTest.log
            build-quality/codeql-results
            trivy-report.txt
          if-no-files-found: warn

  package:
    needs: [validate-release, release-quality]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot libgl1-mesa-dev libxkbcommon-x11-0 libpulse-dev libsecret-1-dev libasound2-dev ninja-build patchelf

      - name: Install Windows packaging dependencies
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.10.3"
          modules: "qthttpserver qtmultimedia qtwebsockets"
          cache: true

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DBUILD_TESTING=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          -DCMAKE_C_COMPILER_LAUNCHER=sccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: cmake --build build --config Release --target package

      - name: Compiler cache statistics
        if: always()
        shell: bash
        run: |
          "${SCCACHE_PATH}" --show-stats

      - name: Build self-contained Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUXDEPLOY_VERSION: 1-alpha-20251107-1
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
          LINUXDEPLOY_QT_VERSION: 1-alpha-20250213-1
        run: |
          mkdir -p release-tools
          curl --fail --location --retry 3 \
            --output release-tools/linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          printf '%s  %s\n' "$LINUXDEPLOY_SHA256" release-tools/linuxdeploy-x86_64.AppImage | sha256sum --check
          curl --fail --location --retry 3 \
            --output release-tools/linuxdeploy-plugin-qt-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/${LINUXDEPLOY_QT_VERSION}/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x release-tools/*.AppImage

          qt_plugins_dir="$(qmake -query QT_INSTALL_PLUGINS)"
          test -n "$qt_plugins_dir"
          sql_drivers_dir="${qt_plugins_dir}/sqldrivers"
          test -d "$sql_drivers_dir"
          test ! -L "$sql_drivers_dir"
          mapfile -d '' unused_sql_drivers < <(
            find "$sql_drivers_dir" -maxdepth 1 -type f \
              -name 'libqsql*.so' ! -name 'libqsqlite.so' -print0
          )
          for driver in "${unused_sql_drivers[@]}"; do
            test -f "$driver"
            test ! -L "$driver"
            case "$driver" in
              "$sql_drivers_dir"/libqsql*.so) ;;
              *) echo "Unexpected SQL driver path: $driver" >&2; exit 1 ;;
            esac
            rm -- "$driver"
          done
          test -f "$sql_drivers_dir/libqsqlite.so"

          export APPIMAGE_EXTRACT_AND_RUN=1
          export PATH="$PWD/release-tools:$PATH"
          export QML_SOURCES_PATHS="$PWD/src/ui"
          export LDAI_OUTPUT="$PWD/build/HolyScreen-${GITHUB_REF_NAME}-Linux-x86_64.AppImage"
          release-tools/linuxdeploy-x86_64.AppImage \
            --appimage-extract-and-run \
            --appdir build/AppDir \
            --executable build/src/holyscreen \
            --desktop-file packaging/app.holyscreen.presenter.desktop \
            --icon-file packaging/holyscreen.svg \
            --plugin qt \
            --output appimage

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HolyScreen-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/*.dmg
            build/*.zip
            build/*.exe
            build/*.deb
            build/*.tar.gz
            build/*.AppImage
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          pattern: HolyScreen-*

      - name: Generate checksums
        shell: bash
        run: |
          mkdir release-assets
          while IFS= read -r -d '' asset; do
            name="${asset##*/}"
            if [[ -e "release-assets/$name" ]]; then
              echo "Duplicate release asset name: $name" >&2
              exit 1
            fi
            cp -- "$asset" "release-assets/$name"
          done < <(find dist -type f -print0 | sort -z)

          (
            cd release-assets
            find . -maxdepth 1 -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #'
          ) > SHA256SUMS
          cp SHA256SUMS release-assets/SHA256SUMS

      - name: Validate package inventory
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg=(release-assets/*.dmg)
          zip=(release-assets/*.zip)
          installer=(release-assets/*.exe)
          deb=(release-assets/*.deb)
          tgz=(release-assets/*.tar.gz)
          appimage=(release-assets/*.AppImage)
          for entry in \
            "DMG:${#dmg[@]}" \
            "ZIP:${#zip[@]}" \
            "NSIS:${#installer[@]}" \
            "DEB:${#deb[@]}" \
            "TGZ:${#tgz[@]}" \
            "AppImage:${#appimage[@]}"; do
            kind="${entry%%:*}"
            count="${entry##*:}"
            if [[ "$count" -lt 1 ]]; then
              echo "Missing required $kind package." >&2
              exit 1
            fi
          done

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            title="HolyScreen $GITHUB_REF_NAME"
            release_flags=(--latest)
            edit_flags=(--prerelease=false --latest)
          else
            title="HolyScreen $GITHUB_REF_NAME (prévia de desenvolvimento)"
            release_flags=(--prerelease)
            edit_flags=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              "${edit_flags[@]}" \
              --title "$title"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --generate-notes \
              "${release_flags[@]}" \
              --title "$title" \
              --verify-tag
          fi

      - name: Download published assets and verify checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir verified-release
          gh release download "$GITHUB_REF_NAME" --dir verified-release
          cd verified-release
          sha256sum --check SHA256SUMS
